<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — MediEase</title>
<meta name="description" content="Access your pharmacy workspace on MediEase." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <a href="#main" class="skip-link">Skip to content</a>

  <main id="main" class="authpage">
    <a href="index.html" class="authlogo">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </span>
      MediFlow
    </a>

    <div class="authcard">
      <h1>Sign in</h1>
      <p class="authcard__sub">Access your pharmacy workspace.</p>

      <form class="authform" id="signinForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
          <p class="field__err" id="err-email"></p>
        </div>

        <div class="field">
          <div class="field__head">
            <label for="password">Password</label>
            <a href="#" id="forgotLink">Forgot password?</a>
          </div>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
          <p class="field__err" id="err-password"></p>
        </div>

        <button type="submit" class="btn btn--solid btn--block" id="signinSubmit">Sign in</button>
      </form>

      <p class="authcard__switch">New pharmacy? <a href="signup.html">Create an account</a></p>
    </div>
  </main>

  <script src="signin.js"></script>
</body>
</html>
